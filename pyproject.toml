[build-system]
requires = ["cython", "setuptools>=77.0.3"]
build-backend = 'setuptools.build_meta'

[project]
name = 'pybcf'
version = '1.4.0'
description = 'Package for loading data from bcf files'
readme = 'README.md'
license = 'MIT'
requires-python = '>=3.9'
authors = [
    {name = "Jeremy McRae", email = 'jmcrae@illumina.com'},
]

dependencies = [
    'numpy',
]

classifiers = [
    'Development Status :: 4 - Beta',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
]

[project.optional-dependencies]
test = [
    'pysam',
]

[tool.setuptools]
include-package-data = false
packages = [
    'pybcf',
]

[tool.setuptools.package-data]
pybcf = [
    'py.typed',
    '*.pyi',
]

[project.urls]
homepage = 'https://github.com/jeremymcrae/pybcf'
